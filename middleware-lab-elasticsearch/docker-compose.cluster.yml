# A real 3-node cluster, for the behaviour a single node cannot show:
# master election and quorum, replica placement, shard relocation, hot/warm tiering.
#
#   docker compose -f docker-compose.cluster.yml up -d
#   curl localhost:9201/_cat/nodes?v
#
# Runs alongside the single-node stack in docker-compose.yml (different project name,
# different ports 9201-9203). Point the test suite at it with:
#   mvn verify -Dlab.es.external.uri=http://localhost:9201
name: lab-es-cluster

x-node: &node
  image: docker.elastic.co/elasticsearch/elasticsearch:8.18.6
  environment: &node-env
    cluster.name: lab-cluster
    # All three are master-eligible: quorum = 2, so the cluster survives losing one node.
    # An even number would buy nothing - see 06-集群与高可用 §2.
    discovery.seed_hosts: es01,es02,es03
    cluster.initial_master_nodes: es01,es02,es03
    node.roles: '["master","data","ingest"]'
    xpack.security.enabled: "false"
    bootstrap.memory_lock: "true"
    ES_JAVA_OPTS: -Xms512m -Xmx512m
    path.repo: /usr/share/elasticsearch/backup
  ulimits:
    memlock: { soft: -1, hard: -1 }
    nofile: { soft: 65536, hard: 65536 }
  mem_limit: 1500m
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s

services:
  # Shared snapshot repository must be writable by uid 1000 on every node.
  backup-permissions:
    image: alpine:3.20
    container_name: lab-cluster-backup-perms
    command: ["sh", "-c", "chown -R 1000:0 /backup && chmod -R 775 /backup"]
    volumes:
      - cluster-backup:/backup

  es01:
    <<: *node
    container_name: lab-es01
    environment:
      <<: *node-env
      node.name: es01
      # Node attributes drive allocation filtering, which is what ILM tiering is built on.
      node.attr.tier: hot
    volumes:
      - es01-data:/usr/share/elasticsearch/data
      - cluster-backup:/usr/share/elasticsearch/backup
    ports:
      - "9201:9200"
    depends_on:
      backup-permissions:
        condition: service_completed_successfully

  es02:
    <<: *node
    container_name: lab-es02
    environment:
      <<: *node-env
      node.name: es02
      node.attr.tier: warm
    volumes:
      - es02-data:/usr/share/elasticsearch/data
      - cluster-backup:/usr/share/elasticsearch/backup
    ports:
      - "9202:9200"
    depends_on:
      backup-permissions:
        condition: service_completed_successfully

  es03:
    <<: *node
    container_name: lab-es03
    environment:
      <<: *node-env
      node.name: es03
      node.attr.tier: cold
    volumes:
      - es03-data:/usr/share/elasticsearch/data
      - cluster-backup:/usr/share/elasticsearch/backup
    ports:
      - "9203:9200"
    depends_on:
      backup-permissions:
        condition: service_completed_successfully

volumes:
  es01-data:
    name: lab-es-cluster-es01
  es02-data:
    name: lab-es-cluster-es02
  es03-data:
    name: lab-es-cluster-es03
  cluster-backup:
    name: lab-es-cluster-backup
